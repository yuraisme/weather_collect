services:
  web:
    build: .
    container_name: homecenter_web
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - backend
    environment:
      - DJANGO_SETTINGS_MODULE=HomeCenter.settings
    volumes:
      - ./HomeCenter/db.sqlite3:/app/HomeCenter/db.sqlite3:nocopy
    command: >
      sh -c "service cron start &&
             uv run python manage.py crontab add &&
             uv run gunicorn HomeCenter.wsgi:application -t 90 -b 0.0.0.0:8000 --log-level INFO"

  nginx:
    image: nginx:alpine  # Используем более легкий образ Alpine
    container_name: homecenter_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./HomeCenter/staticfiles:/static:ro
    depends_on:
      - web

networks:
  backend:
    driver: bridge